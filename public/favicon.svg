<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Royal Gradient Background -->
    <linearGradient id="royalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B164C"/>
      <stop offset="50%" stop-color="#38103A"/>
      <stop offset="100%" stop-color="#2A0E24"/>
    </linearGradient>

    <!-- Metallic Antique Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="30%" stop-color="#E0C058"/>
      <stop offset="70%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9E7B15"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C9A227" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Shield / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#royalBg)"/>
  
  <!-- Outer Gold Filigree Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.8"/>
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.5"/>

  <!-- Royal Crown Emblem -->
  <g transform="translate(156, 90)" filter="url(#goldGlow)">
    <path d="M 0 60 L 30 15 L 75 45 L 100 0 L 125 45 L 170 15 L 200 60 Z" fill="url(#goldGrad)"/>
    <circle cx="30" cy="12" r="6" fill="#FFF"/>
    <circle cx="100" cy="-2" r="7" fill="#FFF"/>
    <circle cx="170" cy="12" r="6" fill="#FFF"/>
    <rect x="0" y="65" width="200" height="12" rx="6" fill="url(#goldGrad)"/>
    <!-- Crown Jewels -->
    <circle cx="50" cy="71" r="3" fill="#4B164C"/>
    <circle cx="100" cy="71" r="3.5" fill="#4B164C"/>
    <circle cx="150" cy="71" r="3" fill="#4B164C"/>
  </g>

  <!-- Royal Monogram Letter 'R' with Serifs -->
  <text 
    x="256" 
    y="390" 
    font-family="'Playfair Display', 'Georgia', serif" 
    font-size="220" 
    font-weight="900" 
    fill="url(#goldGrad)" 
    text-anchor="middle"
    filter="url(#goldGlow)"
  >R</text>

  <!-- Small Tagline Accent -->
  <g transform="translate(196, 430)">
    <circle cx="30" cy="10" r="3" fill="url(#goldGrad)"/>
    <circle cx="60" cy="10" r="4.5" fill="url(#goldGrad)"/>
    <circle cx="90" cy="10" r="3" fill="url(#goldGrad)"/>
  </g>
</svg>
